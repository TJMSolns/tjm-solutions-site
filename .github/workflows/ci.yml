name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Mondays 8am UTC — catch external link rot

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: build/

  vuln-check:
    name: Shipped dependency check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build/
      - run: node scripts/check-shipped-vulns.js

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, vuln-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  links:
    name: Link check
    runs-on: ubuntu-latest
    needs: [build, deploy]
    # Run on push (after deploy actually completes, so the live site being checked
    # reflects this push) and on schedule (deploy is skipped there; build alone is enough).
    # Skip on PRs to avoid noise from draft content.
    if: |
      always() &&
      needs.build.result == 'success' &&
      (github.event_name == 'schedule' || (github.event_name == 'push' && needs.deploy.result == 'success'))
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build/
      # medium.com is excluded because it returns 403 to every automated
      # request regardless of user-agent (verified 2026-08-18: default UA,
      # browser UA, and HEAD all 403). Every article canonical and the
      # site-wide footer link point at tmoores.medium.com, so without the
      # exclusion this job fails on every run -- 122 errors in run
      # 32103981632 (85 bare-footer + 37 canonical occurrences, spanning
      # 31 unique URLs), all of them Medium 403s, none a real broken link.
      # Canonical correctness is covered by the Medium-parity check
      # (WQ-027 non-negotiable), not by this job.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --base https://www.tjm.solutions
            --accept 200,204,206,301,302,429
            --exclude 'linkedin\.com'
            --exclude 'twitter\.com'
            --exclude 'x\.com'
            --exclude 'medium\.com'
            './build/**/*.html'
          fail: true
