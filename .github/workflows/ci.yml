name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Mondays 8am UTC — catch external link rot

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 1
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: build/

  vuln-check:
    name: Shipped dependency check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build/
      - run: node scripts/check-shipped-vulns.js

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, vuln-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  links:
    name: Link check
    runs-on: ubuntu-latest
    needs: [build, deploy]
    # Run on push (after deploy actually completes, so the live site being checked
    # reflects this push) and on schedule (deploy is skipped there; build alone is enough).
    # Skip on PRs to avoid noise from draft content.
    if: |
      always() &&
      needs.build.result == 'success' &&
      (github.event_name == 'schedule' || (github.event_name == 'push' && needs.deploy.result == 'success'))
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build/
      # medium.com is excluded because it returns 403 to every automated
      # request regardless of user-agent (verified 2026-08-18: default UA,
      # browser UA, and HEAD all 403). Every article canonical and the
      # site-wide footer link point at tmoores.medium.com, so without the
      # exclusion this job fails on every run -- 122 errors in run
      # 32103981632 (85 bare-footer + 37 canonical occurrences, spanning
      # 31 unique URLs), all of them Medium 403s, none a real broken link.
      # Canonical correctness is covered by the Medium-parity check
      # (WQ-027 non-negotiable), not by this job.
      #
      # 503 is accepted alongside 429: run 32299599971 (2026-08-19) hit a
      # transient 503 on a live page seconds after this same deploy
      # succeeded -- GitHub Pages CDN/edge propagation still catching up,
      # not a real broken link. Re-checked by hand seconds later: 200.
      #
      # WQ-073 (2026-10-17): scholarly reference lists broke this job. doi.org
      # redirects to publishers that answer bots with 403 (ACM, Wiley, Emerald,
      # Biometrika, World Scientific) or 202 (IEEE), so DOIs are excluded here
      # and checked by scripts/check-dois.sh against the DOI registry instead
      # (it still fails on a DOI that doesn't exist). 202 Accepted is accepted:
      # EUR-Lex ELI links answer 202, and it isn't an error. iso.org and
      # ofcom.org.uk block bots with 403; mckinsey.com fails lychee's HTTP/2.
      # Those three were verified by hand when the article was drafted.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --base https://www.tjm.solutions
            --accept 200,202,204,206,301,302,429,503
            --max-retries 5
            --retry-wait-time 10
            --timeout 45
            --exclude 'linkedin\.com'
            --exclude 'twitter\.com'
            --exclude 'x\.com'
            --exclude 'medium\.com'
            --exclude 'doi\.org'
            --exclude 'iso\.org'
            --exclude 'ofcom\.org\.uk'
            --exclude 'mckinsey\.com'
            './build/**/*.html'
          fail: true
      - name: DOIs exist (DOI registry)
        run: scripts/check-dois.sh build
